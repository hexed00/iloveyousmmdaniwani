<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a0f14" />
  <title>iloveyousmmdaniwani</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #1a0f14;
      color: #fff0e6;
      font-family: 'VT323', monospace;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .box {
      border: 3px solid #8b4558;
      background: rgba(26, 15, 28, .95);
      box-shadow: 8px 8px 0 #0d0609;
      border-radius: 10px;
      padding: 40px 28px;
      max-width: 420px;
    }
    .heart {
      font-size: 42px;
      color: #ff8fab;
      margin-bottom: 16px;
      animation: pulse 1.4s steps(2, end) infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #ff8fab;
      margin-bottom: 18px;
    }
    p { color: #c9a8b0; line-height: 1.5; }
    .note {
      margin-top: 22px;
      font-size: 18px;
      color: #8b4558;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="heart">♡</div>
    <h1>be right back</h1>
    <p>this little place is taking a soft pause.</p>
    <p style="margin-top:10px;">come back soon, pretty baby.</p>
    <p class="note">— darry</p>
  </div>
</body>
</html>
